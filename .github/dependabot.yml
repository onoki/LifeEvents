version: 2
updates:
  - package-ecosystem: npm
    directory: /react-app
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    # Tailwind major releases require coordinated PostCSS, CSS entry-point,
    # plugin, and visual-regression changes; do not treat them as routine bumps.
    ignore:
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
