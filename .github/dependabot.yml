version: 2
updates:
  - package-ecosystem: npm
    directory: /react-app
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Helsinki
    # Disable routine version-update PRs. Dependabot security-update PRs are
    # controlled separately and are not subject to this limit.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Helsinki
    # Disable routine GitHub Actions version-update PRs as well.
    open-pull-requests-limit: 0
